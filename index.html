<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Studio ✦ — type less, get exactly what you want</title>
<meta name="description" content="Type one letter. Get a surgically specific, succinct prompt. Copy or launch straight into ChatGPT, Claude, Gemini or Perplexity.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<style>
:root{
  --bg:#fbfbfa; --panel:#ffffff; --ink:#16222e; --muted:#5f7285; --line:#e4e8ec;
  --accent:#3b6ea5; --accent-ink:#ffffff; --chip:#eef2f6; --chip-on:#3b6ea5; --chip-on-ink:#fff;
  --add:#0a7d51; --shadow:0 10px 30px rgba(22,34,46,.08);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e141b; --panel:#151d26; --ink:#e8ecf1; --muted:#91a3b5; --line:#243140;
    --accent:#7f9cb8; --accent-ink:#0e141b; --chip:#1d2833; --chip-on:#7f9cb8; --chip-on-ink:#0e141b;
    --add:#5ec99a; --shadow:0 10px 30px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink); min-height:100vh;
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;
}
main{max-width:880px; margin:0 auto; padding:40px 20px 80px}
header{display:flex; align-items:baseline; gap:12px; margin-bottom:6px}
h1{font-size:24px; letter-spacing:-.02em; margin:0}
.tag{color:var(--muted); font-size:14px}
.sub{color:var(--muted); margin:0 0 26px; font-size:15px}

/* ---- input + suggestions ---- */
.inputwrap{position:relative}
#q{
  width:100%; font:inherit; font-size:20px; padding:18px 52px 18px 20px;
  border:1.5px solid var(--line); border-radius:16px; background:var(--panel); color:var(--ink);
  outline:none; box-shadow:var(--shadow); transition:border-color .15s;
}
#q:focus{border-color:var(--accent)}
#q::placeholder{color:var(--muted); opacity:.7}
.kbd{
  position:absolute; right:14px; top:50%; transform:translateY(-50%);
  font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:2px 7px;
  background:var(--bg); pointer-events:none;
}
#sug{
  position:absolute; z-index:30; left:0; right:0; top:calc(100% + 6px);
  background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow);
  overflow:hidden; display:none;
}
#sug.open{display:block}
.s-item{display:flex; align-items:center; gap:10px; padding:10px 16px; cursor:pointer; font-size:15.5px}
.s-item .em{width:22px; text-align:center; flex:none}
.s-item .dl{margin-left:auto; color:var(--muted); font-size:12px; flex:none}
.s-item.sel,.s-item:hover{background:var(--chip)}
.s-item b{font-weight:650}
.s-item.s-gold .em{color:#d4a017}
.s-item.s-gold .dl{color:#d4a017; font-weight:650}

/* ---- inline completion: the rest of the top suggestion, shown in place ---- */
#ghost{
  position:absolute; left:0; top:0; right:0; bottom:0; z-index:1;
  border:1.5px solid transparent; padding:18px 52px 18px 20px;
  font:inherit; font-size:20px; line-height:1.55; color:var(--muted);
  pointer-events:none; overflow:hidden; white-space:pre;
}
#ghost .gtyped{color:transparent}

/* ---- chain: the steps already committed, above the box you're typing in ---- */
#chainstrip{display:none; gap:6px; margin:0 0 10px; flex-wrap:wrap; align-items:center}
#chainstrip.on{display:flex}
.step{
  display:inline-flex; align-items:center; gap:7px; max-width:290px;
  border:1px solid var(--line); background:var(--panel); color:var(--ink);
  border-radius:999px; padding:5px 6px 5px 11px; font-size:13px;
}
.step .n{
  flex:none; width:17px; height:17px; border-radius:50%; background:var(--accent); color:var(--accent-ink);
  font-size:10.5px; font-weight:700; display:grid; place-items:center;
}
.step .t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.step .x{
  flex:none; border:none; background:none; color:var(--muted); cursor:pointer;
  font:inherit; font-size:15px; line-height:1; padding:0 3px; border-radius:50%;
}
.step .x:hover{color:var(--ink)}
.steparrow{color:var(--muted); font-size:12px}
#chainstrip .exlabel{font-size:12px; color:var(--muted)}

/* ---- the two axes that define the prompt: steer across, depth up ---- */
.pad{
  display:flex; gap:14px; align-items:stretch; margin-top:16px; padding:12px 16px 10px;
  border:1px solid var(--line); border-radius:14px; background:var(--panel);
}
.axis-y{display:flex; flex-direction:column; align-items:center; gap:4px; flex:none; transition:opacity .15s}
.axis-y.locked{opacity:.32}
.vrange{
  -webkit-appearance:slider-vertical; appearance:slider-vertical;
  writing-mode:vertical-lr; direction:rtl;
  width:22px; height:74px; padding:0; margin:0; accent-color:var(--accent);
}
.axname{font-size:11px; color:var(--muted); text-align:center; line-height:1.35}
.axname output{display:block; color:var(--ink); font-weight:600; font-size:12px}
.axis-x{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:2px}
.padread{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.padread output{font-size:14px; font-weight:650}
.padread span{font-size:12px; color:var(--muted)}
.axticks{display:flex; justify-content:space-between; font-size:10.5px; color:var(--muted)}
.axis-x input[type=range]{margin:2px 0 0}

/* ---- chips ---- */
.row{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; align-items:center}
.rowlabel{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; width:100%; margin-top:14px}
.chip{
  border:1px solid var(--line); background:var(--chip); color:var(--ink);
  padding:6px 13px; border-radius:999px; font:inherit; font-size:13.5px; cursor:pointer;
  transition:transform .05s, background .12s;
}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on)}

/* ---- sliders ---- */
.sliders{display:flex; gap:28px; flex-wrap:wrap; margin-top:18px}
.slider{flex:1; min-width:220px}
.slider label{display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-bottom:4px}
.slider label output{color:var(--ink); font-weight:600}
input[type=range]{width:100%; accent-color:var(--accent)}
.drillwrap{min-width:132px; flex:0 1 auto}
.tunebtn{
  margin-top:18px; font:inherit; font-size:13px; font-weight:600; cursor:pointer;
  color:var(--muted); background:none; border:none; padding:4px 2px;
}
.tunebtn:hover{color:var(--ink)}
#tune{display:none}
#tune.open{display:flex}
#examples .exlabel{font-size:12px; color:var(--muted); align-self:center}
.switch{
  display:block; width:44px; height:24px; border-radius:999px; border:1px solid var(--line);
  background:var(--chip); cursor:pointer; position:relative; padding:0; transition:background .15s;
}
.switch::after{
  content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
  background:var(--panel); box-shadow:0 1px 3px rgba(0,0,0,.25); transition:left .15s;
}
.switch.on{background:var(--accent); border-color:var(--accent)}
.switch.on::after{left:22px}
.learnnote{font-size:11px; color:var(--muted); margin-top:6px; max-width:230px}
.learnnote button{
  font:inherit; font-size:11px; background:none; border:none; padding:0; cursor:pointer;
  color:var(--accent); text-decoration:underline;
}

/* ---- prompt card ---- */
#card{
  margin-top:22px; background:var(--panel); border:1px solid var(--line); border-radius:16px;
  box-shadow:var(--shadow); overflow:hidden;
}
#prompt{
  padding:20px; font-size:16.5px; line-height:1.65; min-height:76px; white-space:pre-wrap; word-break:break-word;
}
#prompt .adds{color:var(--add)}
#prompt .seg{cursor:pointer; border-radius:4px}
#prompt .seg:hover{background:var(--chip); text-decoration:underline dashed; text-underline-offset:3px}
#prompt.empty{color:var(--muted)}
.actions{
  display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  padding:12px 16px; border-top:1px solid var(--line); background:color-mix(in srgb, var(--panel) 70%, var(--bg));
}
.btn{
  font:inherit; font-size:14.5px; font-weight:650; cursor:pointer; border-radius:11px;
  padding:10px 18px; border:1px solid var(--line); background:var(--panel); color:var(--ink);
  transition:transform .05s;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-size:15.5px}
.launch{display:flex; gap:8px; margin-left:auto; flex-wrap:wrap}
.launch .btn{font-weight:500; font-size:13.5px; padding:9px 13px}
.count{font-size:12px; color:var(--muted); width:100%; padding:0 16px 10px; text-align:right}
.modebtn{
  font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; padding:4px 12px;
  border-radius:999px; border:1px solid var(--line); background:var(--chip); color:var(--ink);
}
.metrics{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:10px 16px 0; font-size:12px; color:var(--muted);
}
.cx{
  border:1px solid var(--line); border-radius:999px; padding:2px 10px; cursor:pointer;
  font-weight:650; color:var(--ink); background:var(--chip);
}
.want{border:1px solid var(--line); border-radius:999px; padding:2px 10px; font-weight:650; color:var(--ink)}
.cx[data-l="2"]{color:#8a6d1f; border-color:#d9c48a}
.cx[data-l="3"]{color:#8a3a1f; border-color:#e0b09a}
#graph{width:100%; padding:4px 16px 0; display:none}
#graph.open{display:block}
#graph text{font-size:9px; fill:var(--muted)}

#toast{
  position:fixed; left:50%; bottom:34px; transform:translate(-50%, 20px);
  background:var(--ink); color:var(--bg); padding:11px 20px; border-radius:12px; font-size:14.5px;
  opacity:0; pointer-events:none; transition:.25s; z-index:60; box-shadow:var(--shadow);
}
#toast.show{opacity:1; transform:translate(-50%,0)}

footer{margin-top:46px; color:var(--muted); font-size:13px}
footer a{color:var(--accent)}
@media (max-width:640px){ .launch{margin-left:0} #q{font-size:17px} }
</style>
</head>
<body>
<main>
  <header><h1>Prompt Studio ✦</h1><span class="tag">type less, get exactly what you want</span></header>
  <p class="sub">Type what you need. A ready-to-paste prompt builds itself — tap any part of it to change it.</p>

  <div id="chainstrip"></div>

  <div class="inputwrap">
    <input id="q" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
           placeholder="explain machine learning · fix my resume · trip to japan…" autofocus>
    <div id="ghost" aria-hidden="true"></div>
    <span class="kbd">↵ copies</span>
    <div id="sug" role="listbox"></div>
  </div>

  <div class="row" id="examples"></div>

  <div id="card">
    <div id="prompt" class="empty"></div>
    <div class="metrics" id="metrics"></div>
    <div id="graph"></div>
    <div class="count" id="count"></div>
    <div class="actions">
      <button class="btn primary" id="copy">Copy prompt</button>
      <button class="btn" id="chainadd" type="button"
              title="Keep this prompt and write the next one — it will know what this one asked">+ Next step</button>
      <div class="launch" id="launch"></div>
    </div>
  </div>

  <div class="pad">
    <div class="axis-y" id="depthWrap">
      <input type="range" id="depth" class="vrange" min="0" max="2" step="1" value="1" aria-label="Depth">
      <span class="axname">Depth<output id="depthOut">Standard</output></span>
    </div>
    <div class="axis-x">
      <div class="padread"><output id="steerOut">Guided</output><span id="steerHint">say what I want</span></div>
      <input type="range" id="steer" min="0" max="2" step="1" value="1" aria-label="Steer">
      <div class="axticks"><span>Native</span><span>Guided</span><span>Shaped</span></div>
    </div>
  </div>

  <div class="row" id="chips"></div>

  <button id="tunebtn" class="tunebtn" type="button" aria-expanded="false">Fine-tune ▸</button>
  <div class="sliders" id="tune">
    <div class="slider">
      <label><span>Audience</span><output id="toneOut">Anyone</output></label>
      <input type="range" id="tone" min="0" max="2" step="1" value="1">
    </div>
    <div class="slider drillwrap">
      <label><span>Go-deeper menu</span><output id="drillOut">On</output></label>
      <button id="drill" class="switch on" type="button" aria-pressed="true"
              title="Tight answer first, then 3 numbered drill-downs you pick from"></button>
    </div>
    <div class="slider drillwrap">
      <label><span>Reasoning</span><output id="reasonOut">when earned</output></label>
      <button id="reason" class="modebtn" type="button"
              title="Auto: spend reasoning only when the ask is structurally complex. Always: force it. Off: never.">Auto</button>
    </div>
    <div class="slider drillwrap">
      <label><span>Learns from me</span><output id="learnOut">On</output></label>
      <button id="learn" class="switch on" type="button" aria-pressed="true"
              title="Ranks suggestions by what you actually use. Stored in this browser only — never sent anywhere."></button>
      <div class="learnnote" id="learnnote"></div>
    </div>
  </div>

  <footer>Free, private, nothing leaves your browser. <span id="vocabnote"></span>
    · <a href="goodhart.html">Goodhart's Law, interactive</a></footer>
</main>
<div id="toast"></div>

<!-- Bump ?v= on every release so browsers and the Pages CDN drop stale copies. -->
<script src="data.js?v=19"></script>
<script src="graph.js?v=19"></script>
<script src="bridge.js?v=19"></script>
<script src="reason.js?v=19"></script>
<script src="intent.js?v=19"></script>
<script src="chain.js?v=19"></script>
<script src="profile.js?v=19"></script>
<script src="app.js?v=19"></script>
</body>
</html>
